<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rendir parcialito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  body{ -webkit-user-select:none; user-select:none; } /* disuade copiar texto, no bloquea capturas */
</style>
</head>
<body oncontextmenu="return false;">

<div class="watermark-layer" id="watermark"></div>

<div class="titleblock">
  <div class="titleblock__main">
    <p class="titleblock__eyebrow">Rendir parcialito</p>
    <h1 class="titleblock__title" id="tb-title">Cargando…</h1>
  </div>
  <div class="titleblock__meta">
    <div><b id="tb-count">0</b>preguntas</div>
    <div><b id="tb-points">0 pts</b>puntaje total</div>
    <div><span id="tb-subtitle"></span></div>
  </div>
</div>

<div class="app">
  <div id="identity-root"><p class="empty-note">Cargando el parcialito…</p></div>
  <div id="take-root" style="display:none;"></div>
</div>

<script src="assets/common.js"></script>
<script>
const qp = new URLSearchParams(location.search);
const takeFormId = qp.get("id");
const takeApiUrl = qp.get("api") ? decodeURIComponent(qp.get("api")) : "";
const fixedComision = qp.get("comision") ? decodeURIComponent(qp.get("comision")) : "";
const SUBMITTED_KEY_PREFIX = "parcialito_submitted_";

let form = null;
let tabSwitchesByQuestion = {}; // { [questionId]: cantidad de veces que salió estando en esa pregunta }
let tabSwitchesGeneral = 0; // cambios de pantalla antes de llegar a alguna pregunta (pantalla de identidad)
let currentQuestionId = null; // qué pregunta se está mostrando ahora mismo (para saber a quién sumarle el cambio)
let timerInterval = null;
const identityRoot = document.getElementById("identity-root");
const takeRoot = document.getElementById("take-root");

async function boot() {
  if (!takeFormId || !takeApiUrl) {
    identityRoot.innerHTML = '<div class="empty-note">Este enlace no es válido. Pedile al profesor el QR/enlace generado desde el panel.</div>';
    return;
  }
  try {
    const url = new URL(takeApiUrl);
    url.searchParams.set("action", "getform");
    url.searchParams.set("formId", takeFormId);
    const res = await fetch(url.toString());
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || "No se encontró el parcialito");
    form = data.form;
  } catch (err) {
    identityRoot.innerHTML = `<div class="empty-note">No se pudo cargar el parcialito (${escapeHtml(String(err.message || err))}). Probá de nuevo o avisale al profesor.</div>`;
    return;
  }

  document.getElementById("tb-title").textContent = form.title || "Parcialito";
  document.getElementById("tb-subtitle").textContent = form.subtitle || "";
  const allQuestions = form.sections.flatMap((s) => s.questions);
  const totalPoints = allQuestions.reduce((a, q) => a + (Number(q.points) || 0), 0);
  document.getElementById("tb-count").textContent = allQuestions.length;
  document.getElementById("tb-points").textContent = totalPoints + " pts";

  // si este mismo navegador ya mandó una respuesta para este parcialito, no
  // hace falta pedirle de nuevo los datos ni dejarlo pasar otra vez
  const already = localStorage.getItem(SUBMITTED_KEY_PREFIX + form.id);
  if (already) {
    try {
      const info = JSON.parse(already);
      identityRoot.innerHTML = "";
      const panel = document.createElement("div");
      panel.className = "score-panel";
      panel.innerHTML = `<span>Ya enviaste tu respuesta</span><span class="num">${info.nota != null ? formatNotaValue(info.nota) : formatNota(info.score, info.totalPoints)}</span>`;
      identityRoot.appendChild(panel);
      return;
    } catch (e) { /* si el dato local está corrupto, seguimos como si no hubiera nada */ }
  }

  if (computeEffectiveExamStatus(form, fixedComision) !== "abierto") {
    renderWaitingRoom();
  } else {
    renderIdentity();
  }
}

function renderWaitingRoom() {
  identityRoot.innerHTML = `
    <div class="empty-note">
      <p style="margin:0 0 6px;font-family:var(--font-display);font-size:16px;color:var(--ink);">El profesor todavía no inició el parcial</p>
      <p style="margin:0;">Esta pantalla se actualiza sola — dejala abierta, no hace falta que hagas nada.</p>
    </div>`;
  setTimeout(async () => {
    try {
      const url = new URL(takeApiUrl);
      url.searchParams.set("action", "getform");
      url.searchParams.set("formId", takeFormId);
      const res = await fetch(url.toString());
      const data = await res.json();
      if (data.ok) form = data.form;
    } catch (e) { /* reintenta igual en el próximo ciclo */ }
    if (computeEffectiveExamStatus(form, fixedComision) === "abierto") renderIdentity();
    else renderWaitingRoom();
  }, 4000);
}

function renderIdentity() {
  identityRoot.innerHTML = "";
  const cfg = form.introConfig || { welcomeMessage: "", showApellidoNombre: true, showMail: false, customFields: [] };
  const card = document.createElement("div");
  card.className = "take-question";
  card.innerHTML = `<div class="take-question__label">${formatRichText(escapeHtml(cfg.welcomeMessage || "Antes de empezar"))}</div>`;

  let nameInp = null, numInp = null, mailInp = null, carreraSel = null;

  /* Campo de texto simple, sin botón propio — la comprobación es una sola,
     compartida por los tres campos de identidad (ver más abajo). */
  function buildField(labelText, inputType, extraInputProps) {
    const field = document.createElement("div");
    field.innerHTML = `<label class="field-label">${escapeHtml(labelText)}</label>`;
    const inp = document.createElement("input");
    inp.type = inputType;
    if (extraInputProps) Object.assign(inp, extraInputProps);
    field.appendChild(inp);
    card.appendChild(field);
    return inp;
  }

  if (cfg.showApellidoNombre !== false) {
    nameInp = buildField("Apellido/s y Nombre/s", "text");
  }

  numInp = buildField("N° de alumno (3 dígitos, ej. 007)", "text", { inputMode: "numeric", maxLength: 3 });

  if (cfg.showMail) {
    mailInp = buildField("Mail", "email");
  }

  /* Un solo botón "Comprobar" para los tres campos de arriba (Nombre,
     N° de alumno, Mail): busca por el que el alumno haya completado —
     con prioridad N° de alumno > nombre > mail si completó más de uno —
     y con lo que encuentre autocompleta/pisa los demás. Todo queda
     editable después, por si hay que corregir algo (número mal tipeado,
     nombre mal escrito, etc). La comparación de nombre y mail no
     distingue mayúsculas de minúsculas. */
  const checkWrap = document.createElement("div");
  checkWrap.style.cssText = "margin-top:4px;";
  const checkBtn = document.createElement("button");
  checkBtn.type = "button"; checkBtn.className = "btn btn-small"; checkBtn.textContent = "Comprobar mis datos";
  const checkMsg = document.createElement("div");
  checkMsg.style.cssText = "font-size:12px; margin-top:6px;";
  checkBtn.addEventListener("click", async () => {
    const numVal = numInp.value.trim();
    const nameVal = nameInp ? nameInp.value.trim() : "";
    const mailVal = mailInp ? mailInp.value.trim() : "";

    let paramKey, value;
    if (/^\d{3}$/.test(numVal)) { paramKey = "numeroAlumno"; value = numVal; }
    else if (nameVal) { paramKey = "nombre"; value = nameVal; }
    else if (mailVal) { paramKey = "mail"; value = mailVal; }
    else {
      checkMsg.textContent = "Completá tu N° de alumno (3 dígitos), tu nombre o tu mail para poder comprobar.";
      checkMsg.style.color = "var(--accent-strong)";
      return;
    }

    checkBtn.disabled = true;
    const prevText = checkBtn.textContent;
    checkBtn.textContent = "Buscando…";
    try {
      const url = new URL(takeApiUrl);
      url.searchParams.set("action", "lookupstudent");
      url.searchParams.set(paramKey, value);
      const fetchRes = await fetch(url.toString());
      const res = await fetchRes.json();
      if (res.ok && res.found) {
        if (nameInp && res.nombre) nameInp.value = res.nombre;
        if (numInp && res.numeroAlumno) numInp.value = res.numeroAlumno;
        if (carreraSel && res.carrera) carreraSel.value = res.carrera;
        if (mailInp && res.mail) mailInp.value = res.mail;
        checkMsg.textContent = "Te reconocimos de un parcialito anterior — completamos tus datos. Podés corregir cualquier campo si hace falta.";
        checkMsg.style.color = "var(--good)";
      } else {
        const labels = { numeroAlumno: "el N° de alumno", nombre: "el nombre", mail: "el mail" };
        checkMsg.textContent = `No encontramos ${labels[paramKey]} "${value}" registrado. Revisá que esté bien escrito, o completá tus datos manualmente.`;
        checkMsg.style.color = "var(--accent-strong)";
      }
    } catch (e) {
      checkMsg.textContent = "No se pudo comprobar en este momento.";
      checkMsg.style.color = "var(--accent-strong)";
    }
    checkBtn.disabled = false; checkBtn.textContent = prevText;
  });
  checkWrap.appendChild(checkBtn);
  checkWrap.appendChild(checkMsg);
  card.appendChild(checkWrap);

  const customInputs = []; // { field, getValue }
  (cfg.customFields || []).forEach((field) => {
    const fieldWrap = document.createElement("div");
    fieldWrap.innerHTML = `<label class="field-label">${escapeHtml(field.label || "Campo")}</label>`;
    if (field.type === "choice") {
      const sel = document.createElement("select");
      sel.style.cssText = "width:100%; border:1px solid var(--line-strong); border-radius:2px; padding:8px 10px; font-size:14px;";
      const empty = document.createElement("option"); empty.value = ""; empty.textContent = "Elegí una opción…";
      sel.appendChild(empty);
      (field.options || []).forEach((o) => { const op = document.createElement("option"); op.value = o.text; op.textContent = o.text; sel.appendChild(op); });
      fieldWrap.appendChild(sel);
      customInputs.push({ field, getValue: () => sel.value });
    } else {
      const inp = document.createElement("input"); inp.type = "text";
      fieldWrap.appendChild(inp);
      customInputs.push({ field, getValue: () => inp.value.trim() });
    }
    card.appendChild(fieldWrap);
  });

  if (form.carreras && form.carreras.length > 0) {
    const carreraField = document.createElement("div");
    carreraField.innerHTML = `<label class="field-label">Carrera</label>`;
    carreraSel = document.createElement("select");
    carreraSel.style.cssText = "width:100%; border:1px solid var(--line-strong); border-radius:2px; padding:8px 10px; font-size:14px;";
    const emptyCarreraOpt = document.createElement("option"); emptyCarreraOpt.value = ""; emptyCarreraOpt.textContent = "Elegí tu carrera…";
    carreraSel.appendChild(emptyCarreraOpt);
    form.carreras.forEach((c) => { const o = document.createElement("option"); o.value = c; o.textContent = c; carreraSel.appendChild(o); });
    carreraField.appendChild(carreraSel);
    card.appendChild(carreraField);
  }

  const comField = document.createElement("div");
  let comSel = null;
  if (fixedComision) {
    comField.innerHTML = `<label class="field-label">Comisión</label><div class="warn-banner" style="background:var(--blue-soft); border-color:var(--blue); color:var(--blue);">${escapeHtml(fixedComision)}</div>`;
  } else {
    comField.innerHTML = `<label class="field-label">Comisión</label>`;
    comSel = document.createElement("select");
    comSel.style.cssText = "width:100%; border:1px solid var(--line-strong); border-radius:2px; padding:8px 10px; font-size:14px;";
    const emptyOpt = document.createElement("option"); emptyOpt.value = ""; emptyOpt.textContent = "Elegí tu comisión…";
    comSel.appendChild(emptyOpt);
    (form.comisiones || []).forEach((c) => { const o = document.createElement("option"); o.value = c; o.textContent = c; comSel.appendChild(o); });
    comField.appendChild(comSel);
  }
  card.appendChild(comField);

  const startBtn = document.createElement("button");
  startBtn.className = "btn btn-accent"; startBtn.style.marginTop = "14px";
  startBtn.textContent = "Empezar";
  startBtn.addEventListener("click", async () => {
    const nombre = nameInp ? nameInp.value.trim() : "";
    const numeroAlumno = numInp.value.trim();
    const comision = fixedComision || (comSel ? comSel.value : "");
    const carrera = carreraSel ? carreraSel.value : "";
    const mail = mailInp ? mailInp.value.trim() : "";

    if (cfg.showApellidoNombre !== false && !nombre) { alert("Completá tu Apellido y Nombre para continuar."); return; }
    if (!/^\d{3}$/.test(numeroAlumno)) { alert("El N° de alumno tiene que tener exactamente 3 dígitos (ejemplo: 007)."); return; }
    if (!comision) { alert("Elegí tu comisión para continuar."); return; }
    if (carreraSel && !carrera) { alert("Elegí tu carrera para continuar."); return; }
    if (cfg.showMail && !mail) { alert("Completá tu mail para continuar."); return; }
    for (const ci of customInputs) {
      if (!ci.getValue()) { alert(`Completá "${ci.field.label || "el campo"}" para continuar.`); return; }
    }

    const extra = {};
    customInputs.forEach((ci) => { extra[ci.field.label || ci.field.id] = ci.getValue(); });

    startBtn.disabled = true; startBtn.textContent = "Verificando…";
    try {
      const url = new URL(takeApiUrl);
      url.searchParams.set("action", "check");
      url.searchParams.set("formId", form.id);
      url.searchParams.set("numeroAlumno", numeroAlumno);
      url.searchParams.set("comision", comision);
      const res = await fetch(url.toString());
      const data = await res.json();
      if (data.submitted) {
        identityRoot.innerHTML = '<div class="warn-banner">Este número de alumno ya tiene una respuesta registrada para este parcialito en esta comisión. No se puede volver a rendir.</div>';
        return;
      }
    } catch (e) {
      console.warn("No se pudo verificar reingreso, se continúa igual.", e);
    }
    setupWatermark(nombre || numeroAlumno, numeroAlumno);
    identityRoot.style.display = "none";
    takeRoot.style.display = "block";
    renderTake({ nombre, numeroAlumno, comision, carrera, mail, extra });
  });
  card.appendChild(startBtn);
  identityRoot.appendChild(card);
}

function setupWatermark(nombre, numeroAlumno) {
  const wm = document.getElementById("watermark");
  const text = `${nombre} · ${numeroAlumno}`;
  for (let i = 0; i < 24; i++) {
    const span = document.createElement("span"); span.textContent = text; wm.appendChild(span);
  }
}

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) return;
  if (currentQuestionId) tabSwitchesByQuestion[currentQuestionId] = (tabSwitchesByQuestion[currentQuestionId] || 0) + 1;
  else tabSwitchesGeneral++;
});

function renderTake(identity) {
  takeRoot.innerHTML = "";
  const answers = {};
  const allQuestions = form.sections.flatMap((s) => s.questions.map((q) => Object.assign({}, q, { __sectionTitle: s.title })));
  const totalPoints = allQuestions.reduce((a, q) => a + (Number(q.points) || 0), 0);
  let qIndex = 0;
  let timerBadge = null;

  if (form.timeLimitMinutes) {
    timerBadge = document.createElement("div");
    timerBadge.className = "timer-badge"; timerBadge.id = "timer-badge";
    let secondsLeft = form.timeLimitMinutes * 60;
    updateTimer();
    timerInterval = setInterval(() => {
      secondsLeft--; updateTimer();
      if (secondsLeft <= 0) { clearInterval(timerInterval); doSubmit(true); }
    }, 1000);
    function updateTimer() {
      const m = Math.floor(secondsLeft / 60), s = secondsLeft % 60;
      timerBadge.textContent = `⏱ ${m}:${String(s).padStart(2, "0")}`;
      timerBadge.classList.toggle("warn", secondsLeft <= 60);
    }
  }

  // Traba de "volver atrás" del navegador: cada vez que avanzamos, empujamos
  // un estado nuevo al historial. Si el alumno toca "atrás" del navegador,
  // en vez de volver, lo empujamos de nuevo para adelante. No es 100%
  // infalible (nada del lado del navegador lo es), pero cubre el caso común.
  history.pushState({ take: true, q: 0 }, "", location.href);
  window.addEventListener("popstate", () => { history.pushState({ take: true, q: qIndex }, "", location.href); });

  renderQuestionPage();

  function renderQuestionPage() {
    takeRoot.innerHTML = "";
    if (timerBadge) takeRoot.appendChild(timerBadge);

    const progress = document.createElement("div");
    progress.style.cssText = "font-family:var(--font-mono);font-size:12px;color:var(--muted);margin-bottom:10px;";
    progress.textContent = `Pregunta ${qIndex + 1} de ${allQuestions.length}`;
    takeRoot.appendChild(progress);

    const q = allQuestions[qIndex];
    currentQuestionId = q.id;

    const secTitle = document.createElement("div");
    secTitle.style.cssText = "font-family:var(--font-display);font-weight:600;font-size:13px;color:var(--blue-strong);margin-bottom:6px;";
    secTitle.textContent = q.__sectionTitle;
    takeRoot.appendChild(secTitle);

    const card = document.createElement("div");
    card.className = "take-question"; card.dataset.qid = q.id;
    const lbl = document.createElement("div");
    lbl.className = "take-question__label"; lbl.innerHTML = formatRichText(escapeHtml(q.label || "(sin enunciado)"));
    card.appendChild(lbl);
    const pts = document.createElement("div");
    pts.className = "take-question__points"; pts.textContent = `Valor: ${q.points} punto(s)`;
    if (q.multiSelect && q.requiredSelectionCount) pts.textContent += ` — marcá exactamente ${q.requiredSelectionCount} opción(es)`;
    card.appendChild(pts);
    if (q.image) { const img = document.createElement("img"); img.className = "q-img"; img.src = q.image; card.appendChild(img); }

    if (q.type === "short_text" || q.type === "number") {
      const inp = document.createElement("input");
      inp.type = "text";
      inp.value = answers[q.id] || "";
      inp.addEventListener("input", () => { answers[q.id] = inp.value; });
      card.appendChild(inp);
    } else if (q.multiSelect) {
      answers[q.id] = answers[q.id] || [];
      const limitMsg = document.createElement("div");
      limitMsg.style.cssText = "font-size:12px;color:var(--accent-strong);margin-top:6px;display:none;";
      q.options.forEach((opt) => {
        const row = document.createElement("label"); row.className = "choice-row";
        const check = document.createElement("input");
        check.type = "checkbox"; check.value = opt.id;
        check.checked = answers[q.id].includes(opt.id);
        check.addEventListener("change", () => {
          if (check.checked && q.requiredSelectionCount && answers[q.id].length >= q.requiredSelectionCount) {
            check.checked = false;
            limitMsg.textContent = `Ya marcaste el máximo de ${q.requiredSelectionCount} opción(es) — destildá una para elegir otra.`;
            limitMsg.style.display = "block";
            return;
          }
          limitMsg.style.display = "none";
          if (check.checked) answers[q.id].push(opt.id);
          else answers[q.id] = answers[q.id].filter((id) => id !== opt.id);
        });
        row.appendChild(check);
        const span = document.createElement("span"); span.textContent = opt.text;
        row.appendChild(span);
        card.appendChild(row);
      });
      card.appendChild(limitMsg);
    } else {
      q.options.forEach((opt) => {
        const row = document.createElement("label"); row.className = "choice-row";
        const radio = document.createElement("input");
        radio.type = "radio"; radio.name = "take_" + q.id; radio.value = opt.id;
        radio.checked = answers[q.id] === opt.id;
        radio.addEventListener("change", () => { answers[q.id] = opt.id; });
        row.appendChild(radio);
        const span = document.createElement("span"); span.textContent = opt.text;
        row.appendChild(span);
        card.appendChild(row);
      });
    }
    takeRoot.appendChild(card);

    const isLast = qIndex === allQuestions.length - 1;
    const nextBtn = document.createElement("button");
    nextBtn.className = "btn btn-accent"; nextBtn.style.marginTop = "14px";
    nextBtn.textContent = isLast ? "Enviar respuestas" : "Siguiente →";
    nextBtn.addEventListener("click", () => {
      if (!validateCurrentQuestion(q)) return;
      if (isLast) { doSubmit(false); return; }
      qIndex++;
      history.pushState({ take: true, q: qIndex }, "", location.href);
      renderQuestionPage();
    });
    takeRoot.appendChild(nextBtn);

    const hint = document.createElement("p");
    hint.className = "hint"; hint.style.cssText = "font-size:11px;color:var(--muted);margin-top:8px;";
    hint.textContent = "Una vez que avanzás no podés volver a esta pregunta.";
    takeRoot.appendChild(hint);
  }

  function validateCurrentQuestion(q) {
    const given = answers[q.id];
    if (q.multiSelect && q.requiredSelectionCount) {
      const count = (given || []).length;
      if (count !== q.requiredSelectionCount) {
        alert(`Tenés que marcar exactamente ${q.requiredSelectionCount} opción(es). Marcaste ${count}.`);
        return false;
      }
    }
    if (q.required !== false) {
      const empty = given === undefined || given === null || given === "" || (Array.isArray(given) && given.length === 0);
      if (empty) { alert("Esta pregunta es obligatoria — respondela antes de continuar."); return false; }
    }
    return true;
  }

  /* Traduce lo que el alumno marcó/escribió a texto legible ANTES de guardarlo,
     usando las opciones del formulario tal como están en este mismo momento
     (que es el único momento en que el ID de opción tiene garantía de
     coincidir). Así el resultado queda legible para siempre, aunque el
     profesor edite el parcialito más adelante. */
  function humanizeGivenAnswer(q, given) {
    if (given === undefined || given === null || given === "") return q.multiSelect ? "" : "";
    if (q.type === "multiple_choice") {
      const optMap = {};
      (q.options || []).forEach((o) => { optMap[o.id] = o.text; });
      if (Array.isArray(given)) return given.map((id) => optMap[id] || id).join(" + ");
      return optMap[given] || String(given);
    }
    return String(given);
  }

  function doSubmit(auto) {
    if (timerInterval) clearInterval(timerInterval);
    const activeBtn = takeRoot.querySelector("button.btn-accent");
    if (activeBtn) { activeBtn.disabled = true; activeBtn.textContent = "Enviando…"; }

    let score = 0;
    const detail = [];
    allQuestions.forEach((q) => {
      const given = answers[q.id];
      const { correct, puntos } = scoreQuestionAnswer(q, given);
      score += puntos;
      detail.push({
        pregunta: q.label, respuesta: humanizeGivenAnswer(q, given),
        correcta: correct, puntos, cambiosPantalla: tabSwitchesByQuestion[q.id] || 0,
      });
    });
    score = Math.round(score * 100) / 100;
    const nota = scoreToNotaCurva(score, totalPoints);
    const tabSwitchesTotal = tabSwitchesGeneral + Object.values(tabSwitchesByQuestion).reduce((a, v) => a + v, 0);

    fetch(takeApiUrl, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        action: "submit", formId: form.id, formTitle: form.title,
        comision: identity.comision, carrera: identity.carrera || "", numeroAlumno: identity.numeroAlumno,
        nombre: identity.nombre, mail: identity.mail || "", extra: identity.extra || {},
        score, totalPoints, tabSwitches: tabSwitchesTotal, detail, nota,
      }),
    }).then((r) => r.json()).catch((e) => ({ ok: false, error: "No se pudo conectar con la planilla. Probá de nuevo si tenés conexión." }))
      .then((data) => {
        takeRoot.innerHTML = "";
        const panel = document.createElement("div");
        if (data && data.ok) {
          localStorage.setItem(SUBMITTED_KEY_PREFIX + form.id, JSON.stringify({
            numeroAlumno: identity.numeroAlumno, comision: identity.comision, score, totalPoints, nota, ts: Date.now(),
          }));
          panel.className = "score-panel";
          panel.innerHTML = `<span>${auto ? "Tiempo agotado — envío automático" : "Nota obtenida"}</span><span class="num">${formatNotaValue(nota)}</span>`;
          takeRoot.appendChild(panel);
          const note = document.createElement("p");
          note.className = "hint"; note.style.cssText = "font-size:12px;color:var(--muted);margin-top:10px;";
          note.textContent = "Tu respuesta ya quedó registrada. Podés cerrar esta ventana.";
          takeRoot.appendChild(note);
        } else {
          panel.className = "warn-banner";
          panel.textContent = (data && data.error) || "No se pudo registrar la respuesta.";
          takeRoot.appendChild(panel);
        }
      });
  }
}

boot();
</script>
</body>
</html>
