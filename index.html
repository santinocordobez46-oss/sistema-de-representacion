<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis parcialitos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="titleblock">
  <div class="titleblock__main">
    <p class="titleblock__eyebrow">Panel de cátedra</p>
    <h1 class="titleblock__title">Mis parcialitos</h1>
  </div>
  <div class="titleblock__meta">
    <div><b id="tb-count">0</b>formularios</div>
    <div><span>Creá, editá y publicá tantos como necesites</span></div>
  </div>
</div>

<div class="app">
  <div class="toolbar">
    <span class="hint">Cada tarjeta es un parcialito completo: preguntas, puntaje, comisiones, QR y resultados.</span>
    <button class="btn" id="btn-import">Importar .json</button>
    <input type="file" id="file-import" accept=".json" style="display:none;">
  </div>

  <div class="forms-grid" id="forms-grid"></div>
</div>

<script src="assets/common.js"></script>
<script>
function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleDateString("es-AR") + " " + d.toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" });
}

function render() {
  const grid = document.getElementById("forms-grid");
  grid.innerHTML = "";
  const forms = loadForms().sort((a, b) => new Date(b.updatedAt || b.createdAt) - new Date(a.updatedAt || a.createdAt));
  document.getElementById("tb-count").textContent = forms.length;

  forms.forEach((form) => {
    const card = document.createElement("div");
    card.className = "form-card";
    card.innerHTML = `
      <span class="form-card__tick">${questionCountOf(form)} preg. · ${totalPointsOf(form)} pts</span>
      <div class="form-card__title">${escapeHtml(form.title || "Sin título")}</div>
      <div class="form-card__meta">
        <span>${(form.comisiones || []).length} comisión(es)</span>
        <span>Editado ${fmtDate(form.updatedAt || form.createdAt)}</span>
      </div>
      <div class="form-card__actions">
        <button class="btn btn-small btn-primary" data-act="edit">Editar</button>
        <button class="btn btn-small" data-act="publish">Publicar / QR</button>
        <button class="btn btn-small" data-act="results">Resultados</button>
        <button class="btn btn-small btn-danger" data-act="delete">Borrar</button>
      </div>`;
    card.querySelector('[data-act="edit"]').addEventListener("click", (e) => { e.stopPropagation(); location.href = "editor.html?id=" + form.id; });
    card.querySelector('[data-act="publish"]').addEventListener("click", (e) => { e.stopPropagation(); location.href = "editor.html?id=" + form.id + "&tab=publish"; });
    card.querySelector('[data-act="results"]').addEventListener("click", (e) => { e.stopPropagation(); location.href = "resultados.html?id=" + form.id; });
    card.querySelector('[data-act="delete"]').addEventListener("click", (e) => {
      e.stopPropagation();
      if (confirm(`¿Borrar "${form.title}"? Esto no borra las respuestas ya guardadas en Google Sheets, solo el formulario de este panel.`)) {
        deleteForm(form.id); render();
      }
    });
    card.addEventListener("click", () => { location.href = "editor.html?id=" + form.id; });
    grid.appendChild(card);
  });

  const newCard = document.createElement("button");
  newCard.className = "new-form-card";
  newCard.textContent = "+ Nuevo parcialito en blanco";
  newCard.addEventListener("click", () => {
    const f = makeBlankForm();
    upsertForm(f);
    location.href = "editor.html?id=" + f.id;
  });
  grid.appendChild(newCard);

  if (forms.length === 0) {
    const exampleCard = document.createElement("button");
    exampleCard.className = "new-form-card";
    exampleCard.style.gridColumn = "span 1";
    exampleCard.innerHTML = "+ Cargar el ejemplo del PARCIALITO LAMINA Nro. 0";
    exampleCard.addEventListener("click", () => {
      const f = defaultExampleForm();
      upsertForm(f);
      location.href = "editor.html?id=" + f.id;
    });
    grid.insertBefore(exampleCard, grid.firstChild);
  }
}

document.getElementById("btn-import").addEventListener("click", () => document.getElementById("file-import").click());
document.getElementById("file-import").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const form = JSON.parse(reader.result);
      form.id = uid("form"); // evita choques de ID al importar
      upsertForm(form);
      render();
    } catch (err) { alert("El archivo no es un formulario válido."); }
  };
  reader.readAsText(file);
});

render();
</script>
</body>
</html>
